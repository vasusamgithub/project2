apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vasu.fullname" . }}
  labels:
    {{- include "vasu.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "vasu.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "vasu.selectorLabels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
